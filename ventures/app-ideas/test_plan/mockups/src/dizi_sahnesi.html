<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;}
  body{background:#000;font-family:Inter,sans-serif;color:#fff;position:relative;}
  .bar{position:absolute;left:0;right:0;height:250px;background:#000;z-index:3;}
  .bar.t{top:0}.bar.b{bottom:0}
  .scene{position:absolute;top:250px;bottom:250px;left:0;right:0;
    background:
      radial-gradient(ellipse at 62% 38%, rgba(255,190,120,.55), transparent 42%),
      radial-gradient(ellipse at 30% 70%, rgba(120,40,30,.55), transparent 55%),
      linear-gradient(160deg,#2a1610 0%,#4a2418 40%,#160b08 100%);}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%);}
  .glass{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:300px;filter:blur(1.5px) saturate(.8);opacity:.9;}
  .ep{position:absolute;top:290px;left:60px;z-index:4;font-size:28px;letter-spacing:8px;color:rgba(255,255,255,.75);}
  .sub{position:absolute;bottom:330px;left:70px;right:70px;z-index:4;text-align:center;
    font-size:58px;font-weight:600;line-height:1.3;text-shadow:0 3px 10px #000, 0 0 2px #000;}
  .sub i{display:block;font-size:34px;font-weight:400;color:#f3d39a;margin-bottom:18px;font-style:normal;letter-spacing:3px;}
  .top{position:absolute;top:80px;left:0;right:0;text-align:center;z-index:5;font-size:44px;font-weight:800;}
  .top span{display:block;font-size:30px;font-weight:500;color:#bbb;margin-top:12px;}
  .wm{position:absolute;bottom:90px;left:0;right:0;text-align:center;z-index:5;font-size:28px;color:#999;}
</style></head><body>
<div class="bar t"></div><div class="bar b"></div>
<div class="top">“Çay demlenmedi.”<span>Türk dizisi versiyonu 👇</span></div>
<div class="scene"><div class="glass">🫖</div><div class="vig"></div></div>
<div class="ep">BÖLÜM 47</div>
<div class="sub"><i>— ANNE (titreyen sesle) —</i>Bu evde... çay bile demlenmiyor artık, Kemal.<br>Biz ne zaman bu hale geldik?</div>
<div class="wm">Dizi Sahnesi · hayatın bir dizi olsaydı · yakında</div>
</body></html>
